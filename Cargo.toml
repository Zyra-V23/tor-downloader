[package]
name = "tor-downloader-rs"
version = "0.1.0"
edition = "2024"
description = "Multi-threaded recursive .onion site downloader with Tor support"
authors = ["Zyra-V23"]
license = "MIT"
repository = "https://github.com/Zyra-V23/tor-downloader"
keywords = ["tor", "onion", "downloader", "recursive", "web-scraping"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
# HTTP client with proxy support
reqwest = { version = "0.11", features = ["socks", "json", "stream"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# HTML parsing
scraper = "0.18"
select = "0.6"

# URL parsing and manipulation
url = "2.4"

# Command line argument parsing
clap = { version = "4.4", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Progress bars and terminal UI
indicatif = "0.17"
console = "0.15"

# File system utilities
walkdir = "2.4"
tempfile = "3.8"

# Regex for URL filtering
regex = "1.10"

# Futures utilities
futures = "0.3"
futures-util = "0.3"

# Threading and concurrency
rayon = "1.8"
crossbeam = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration
config = "0.13"

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

# Random utilities
rand = "0.8"

# Byte utilities
bytes = "1.5"

# Mime type detection
mime_guess = "2.0"

# Terminal UI
ratatui = "0.24"
crossterm = "0.27"

[dev-dependencies]
criterion = "0.5"
mockito = "1.2"

<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="onionGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#9c4dcc"/>
      <stop offset="50%" stop-color="#7b1fa2"/>
      <stop offset="100%" stop-color="#4a148c"/>
    </radialGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b1fa2">
        <animate attributeName="stop-color" values="#7b1fa2;#e1bee7;#7b1fa2" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#4a148c">
        <animate attributeName="stop-color" values="#4a148c;#9c4dcc;#4a148c" dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>
  
  <circle cx="100" cy="100" r="45" fill="#e1bee7" opacity="0.3">
    <animate attributeName="r" values="40;50;40" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 100 100;360 100 100" dur="20s" repeatCount="indefinite"/>
    
    <path d="M 100 55 C 125 55 145 75 145 100 C 145 125 125 145 100 145 C 75 145 55 125 55 100 C 55 75 75 55 100 55 Z" 
          fill="url(#onionGrad)" stroke="#4a148c" stroke-width="2" opacity="0.9"/>
    
    <path d="M 100 65 C 115 65 130 80 130 100 C 130 120 115 135 100 135 C 85 135 70 120 70 100 C 70 80 85 65 100 65 Z" 
          fill="none" stroke="#e1bee7" stroke-width="1.5" opacity="0.7">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <path d="M 100 75 C 110 75 120 85 120 100 C 120 115 110 125 100 125 C 90 125 80 115 80 100 C 80 85 90 75 100 75 Z" 
          fill="none" stroke="#f3e5f5" stroke-width="1" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
    </path>
    
    <circle cx="100" cy="100" r="8" fill="#f3e5f5" opacity="0.9">
      <animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <path d="M 95 60 Q 100 50 105 60" fill="#4caf50" opacity="0.8"/>
    <path d="M 90 62 Q 95 52 100 62" fill="#66bb6a" opacity="0.7"/>
    <path d="M 100 62 Q 105 52 110 62" fill="#66bb6a" opacity="0.7"/>
  </g>
  
  <circle cx="150" cy="80" r="2" fill="#e1bee7" opacity="0.6">
    <animate attributeName="cy" values="80;60;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="50" cy="120" r="1.5" fill="#9c4dcc" opacity="0.6">
    <animate attributeName="cy" values="120;100;120" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  
  <text x="220" y="85" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#textGrad)">
    TOR
    <animate attributeName="y" values="85;80;85" dur="2s" repeatCount="indefinite"/>
  </text>
  
  <text x="220" y="115" font-family="Arial, sans-serif" font-size="18" fill="#7b1fa2">
    DOWNLOADER
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </text>
  
  <text x="220" y="135" font-family="Arial, sans-serif" font-size="12" fill="#9c4dcc" opacity="0.8">
    Multi-threaded .onion crawler
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="4s" repeatCount="indefinite"/>
  </text>
  
  <path d="M 145 95 Q 180 75 220 90" stroke="#e1bee7" stroke-width="1" fill="none" opacity="0.4">
    <animate attributeName="stroke-dasharray" values="0,100;50,50;0,100" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <path d="M 145 105 Q 180 125 220 110" stroke="#e1bee7" stroke-width="1" fill="none" opacity="0.4">
    <animate attributeName="stroke-dasharray" values="0,100;50,50;0,100" dur="3s" begin="1s" repeatCount="indefinite"/>
  </path>
  
  <g font-family="monospace" font-size="8" fill="#9c4dcc" opacity="0.3">
    <text x="320" y="70">01001</text>
    <text x="320" y="85">11010</text>
    <text x="320" y="100">10110</text>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="6s" repeatCount="indefinite"/>
  </g>
</svg> 